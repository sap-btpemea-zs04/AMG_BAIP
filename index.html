<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Muhaidib Group × SAP — The Autonomous Enterprise Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   AL MUHAIDIB × SAP — AUTONOMOUS ENTERPRISE JOURNEY
   Design tokens derived from: SAP Joule brand palette (Indigo7
   #5D36FF / Indigo9 #2C13AD / Blue7 #0070F2), the navy-to-violet
   crystal hero gradient used across SAP Business AI decks, and
   Al Muhaidib's brand triangle (leaf green / amber / sky blue).
   ============================================================ */

:root{
  /* --- Core Joule / SAP palette --- */
  --navy-deep:      #0A1340;
  --navy:            #0F1A4A;
  --indigo-9:        #2C13AD;
  --indigo-7:        #5D36FF;
  --indigo-3:        #D3B6FF;
  --blue-7:          #0070F2;
  --blue-3:          #A6E0FF;
  --teal-7:          #07838F;
  --grey-9:          #223548;
  --grey-7:          #475E75;
  --grey-3:          #D5DADD;

  /* --- Al Muhaidib bridge accents (from logo mark) --- */
  --amg-green:       #7AB648;
  --amg-orange:      #F5A623;
  --amg-sky:         #29ABE2;
  --amg-navy-text:   #0B3C61;

  /* --- Surfaces --- */
  --surface-page:    #F7F8FC;
  --surface-card:    #FFFFFF;
  --surface-tint:    #EFF1FB;
  --surface-dark:    #0F1A4A;

  /* --- Text --- */
  --ink-900:         #0B1130;
  --ink-700:         #2C3454;
  --ink-500:         #5B6584;
  --ink-on-dark:     #F3F4FC;
  --ink-on-dark-dim: #B9BEDC;

  /* --- Gradients --- */
  --grad-hero: linear-gradient(125deg, #0A1340 0%, #1B1E6E 28%, #4321B0 62%, #7A2FD6 100%);
  --grad-crystal: linear-gradient(135deg, #8B6BFF 0%, #5D36FF 50%, #2C13AD 100%);
  --grad-accent-line: linear-gradient(90deg, var(--amg-green), var(--amg-orange), var(--amg-sky));

  /* --- Type --- */
  --font-display: 'Space Grotesk', 'Inter', sans-serif;
  --font-body: 'Inter', -apple-system, sans-serif;

  /* --- Geometry --- */
  --rail-width: 96px;
  --footer-height: 52px;
  --brandbar-height: 86px;
  --pagenav-height: 72px;
  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --shadow-soft: 0 8px 32px rgba(15, 26, 74, 0.08);
  --shadow-card: 0 4px 20px rgba(15, 26, 74, 0.10);
  --shadow-float: 0 16px 48px rgba(44, 19, 173, 0.22);

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

*, *::before, *::after{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  font-family: var(--font-body);
  background: var(--surface-page);
  color: var(--ink-900);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
img{ max-width:100%; display:block; }
button{ font-family: inherit; cursor:pointer; }
ol,ul{ list-style:none; margin:0; padding:0; }
a{ color: inherit; }
h1,h2,h3,h4,p{ margin:0; }

::selection{ background: var(--indigo-3); color: var(--indigo-9); }

/* Respect reduced motion */
@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}

/* Visible keyboard focus */
:focus-visible{
  outline: 3px solid var(--blue-7);
  outline-offset: 3px;
  border-radius: 4px;
}

/* ============ AMBIENT BACKGROUND ============ */
.ambient-bg{
  position: fixed;
  top:0; right:0; bottom:0; left:0;
  z-index: -2;
  background-image:
    radial-gradient(ellipse 900px 600px at 88% 0%, rgba(166, 224, 255, 0.35), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 8%, rgba(211, 182, 255, 0.30), transparent 55%),
    linear-gradient(168deg, rgba(250,251,254,0.94) 0%, rgba(242,244,251,0.94) 55%, rgba(236,239,250,0.94) 100%),
    url('media/img/bg-texture.jpeg');
  background-size: auto, auto, auto, cover;
  background-position: top right, top right, top right, top center;
  background-repeat: no-repeat;
  transition: opacity 0.6s var(--ease);
}
.ambient-bg.is-dark{
  background: var(--grad-hero);
}

/* ============ BRAND BAR ============ */
.brand-bar{
  position: fixed;
  top:0; left: var(--rail-width); right:0;
  height: var(--brandbar-height);
  z-index: 60;
  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-bottom: 1px solid rgba(15, 26, 74, 0.07);
  transition: left 0.3s var(--ease), background 0.4s var(--ease), border-color 0.4s var(--ease);
}
.brand-bar.is-dark{
  background: rgba(10, 19, 64, 0.55);
  border-bottom-color: rgba(255,255,255,0.10);
}
.brand-bar__inner{
  height:100%;
  display:flex;
  align-items:center;
  gap: 20px;
  padding: 0 28px;
  max-width: 1600px;
}
.brand-bar__logo--customer img{
  height: 56px;
  width: auto;
  object-fit: contain;
  display: block;
}
.brand-bar__divider{
  width:1px; height: 44px;
  background: linear-gradient(180deg, transparent, rgba(15,26,74,0.18), transparent);
  flex-shrink:0;
}
.brand-bar.is-dark .brand-bar__divider{
  background: linear-gradient(180deg, transparent, rgba(255,255,255,0.25), transparent);
}
.brand-bar__title{
  display:flex; flex-direction:column; gap:2px;
  min-width:0;
}
.brand-bar__eyebrow{
  font-family: var(--font-display);
  font-weight:600;
  font-size: 16px;
  color: var(--ink-900);
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow:hidden;
  text-overflow: ellipsis;
  transition: color 0.4s var(--ease);
}
.brand-bar.is-dark .brand-bar__eyebrow{ color: #fff; }
.brand-bar__sub{
  font-size: 12.5px;
  color: var(--ink-500);
  font-weight:500;
  transition: color 0.4s var(--ease);
}
.brand-bar.is-dark .brand-bar__sub{ color: var(--ink-on-dark-dim); }

.brand-bar__menu-toggle{
  display:none;
  margin-left:auto;
  width:40px; height:40px;
  border-radius: 10px;
  border: none;
  background: rgba(15,26,74,0.06);
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.brand-bar__menu-toggle span{
  width:18px; height:2px; border-radius:2px;
  background: var(--ink-900);
  transition: transform 0.3s var(--ease), opacity 0.3s var(--ease);
}
.brand-bar.is-dark .brand-bar__menu-toggle span{ background:#fff; }

/* ============ JOURNEY RAIL (LEFT) ============ */
.journey-rail{
  position: fixed;
  top:0; left:0; bottom:0;
  width: var(--rail-width);
  z-index: 70;
  background: linear-gradient(195deg, #120A3D 0%, #1C1166 45%, #2C13AD 100%);
  display:flex; flex-direction:column;
  align-items:center;
  padding: 18px 0 14px;
  box-shadow: 4px 0 24px rgba(10,12,40,0.18);
}
.journey-rail__crystal{
  width: 46px; height: 46px;
  margin-bottom: 18px;
  flex-shrink:0;
}
.crystal-svg{ width:100%; height:100%; filter: drop-shadow(0 4px 10px rgba(93,54,255,0.5)); }

.journey-rail__list{
  display:flex; flex-direction:column;
  gap: 4px;
  width:100%;
  overflow-y:auto;
  flex:1;
  padding: 2px 8px;
  scrollbar-width: thin;
}
.journey-rail__list::-webkit-scrollbar{ width:4px; }
.journey-rail__list::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.2); border-radius:4px; }

.rail-item{
  position:relative;
  display:flex; flex-direction:column; align-items:center;
  gap:5px;
  padding: 9px 4px;
  border-radius: 12px;
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.55);
  width:100%;
  transition: background 0.25s var(--ease), color 0.25s var(--ease);
  text-align:center;
}
.rail-item:hover{ background: rgba(255,255,255,0.08); color:#fff; }
.rail-item.is-active{
  background: rgba(255,255,255,0.14);
  color:#fff;
}
.rail-item.is-active::before{
  content:'';
  position:absolute;
  left:-8px; top:50%; transform: translateY(-50%);
  width:4px; height: 22px;
  border-radius: 4px;
  background: linear-gradient(180deg, var(--blue-3), #fff);
}
.rail-item__dot{
  width: 7px; height:7px;
  border-radius:50%;
  background: currentColor;
  opacity:0.5;
}
.rail-item.is-active .rail-item__dot{
  opacity:1;
  background: #fff;
  box-shadow: 0 0 0 4px rgba(255,255,255,0.18);
}
.rail-item.is-done .rail-item__dot{
  background: var(--amg-sky);
  opacity:1;
}
.rail-item__label{
  font-size: 9.5px;
  font-weight:600;
  line-height:1.25;
  letter-spacing: 0.01em;
}

/* ============ MOBILE NAV DRAWER ============ */
.nav-drawer{
  position: fixed; top:0; right:0; bottom:0; left:0; z-index: 200;
  background: rgba(10,12,40,0.55);
  backdrop-filter: blur(4px);
  opacity:0; pointer-events:none;
  transition: opacity 0.3s var(--ease);
}
.nav-drawer.is-open{ opacity:1; pointer-events:auto; }
.nav-drawer__panel{
  position:absolute; top:0; left:0; bottom:0;
  width: min(340px, 84vw);
  background: linear-gradient(195deg, #120A3D 0%, #1C1166 45%, #2C13AD 100%);
  transform: translateX(-100%);
  transition: transform 0.35s var(--ease);
  display:flex; flex-direction:column;
  padding: 20px;
}
.nav-drawer.is-open .nav-drawer__panel{ transform: translateX(0); }
.nav-drawer__head{
  display:flex; align-items:center; justify-content:space-between;
  color:#fff; font-family: var(--font-display); font-weight:600; font-size:18px;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}
.nav-drawer__head button{
  background:none; border:none; color:#fff; font-size:28px; line-height:1;
}
.nav-drawer__list{
  display:flex; flex-direction:column; gap:2px;
  overflow-y:auto;
}
.nav-drawer__item{
  display:flex; align-items:center; gap:12px;
  padding: 12px 10px;
  border-radius: 12px;
  background:none; border:none;
  color: rgba(255,255,255,0.7);
  font-size: 14.5px; font-weight:600;
  text-align:left;
  width:100%;
}
.nav-drawer__item.is-active{ background: rgba(255,255,255,0.12); color:#fff; }
.nav-drawer__item .rail-item__dot{ flex-shrink:0; }

/* ============ STAGE / SECTIONS ============ */
.stage{
  margin-left: var(--rail-width);
  padding-top: var(--brandbar-height);
  padding-bottom: calc(var(--pagenav-height) + var(--footer-height));
  min-height: 100vh;
}
.section{
  display:none;
  min-height: 70vh;
  padding: 48px 56px 64px;
  max-width: 1480px;
  margin: 0 auto;
  animation: sectionIn 0.55s var(--ease);
}
.section.is-active{ display:block; }
@keyframes sectionIn{
  from{ opacity:0; transform: translateY(14px); }
  to{ opacity:1; transform: translateY(0); }
}
.section--dark{ color: var(--ink-on-dark); }

/* ============ PAGE NAV (bottom) ============ */
.page-nav{
  position: fixed;
  left: var(--rail-width); right:0; bottom: var(--footer-height);
  height: var(--pagenav-height);
  z-index: 55;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  border-top: 1px solid rgba(15,26,74,0.07);
  display:flex; align-items:center; justify-content:space-between;
  padding: 0 28px;
  gap: 20px;
  transition: left 0.3s var(--ease);
}
.page-nav__btn{
  display:flex; align-items:center; gap:8px;
  background: var(--surface-card);
  border: 1px solid rgba(15,26,74,0.10);
  color: var(--ink-900);
  font-weight:700;
  font-size: 14px;
  padding: 11px 18px;
  border-radius: 999px;
  box-shadow: var(--shadow-card);
  transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), background 0.2s var(--ease);
}
.page-nav__btn:hover{ transform: translateY(-2px); box-shadow: var(--shadow-float); }
.page-nav__btn:disabled{ opacity:0.35; pointer-events:none; }
.page-nav__btn svg{ width:18px; height:18px; }
.page-nav__btn--next{
  background: linear-gradient(120deg, var(--indigo-7), var(--indigo-9));
  color:#fff; border:none;
}
.page-nav__progress{
  flex:1; max-width: 480px;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.page-nav__progress-track{
  width:100%; height:5px;
  background: rgba(15,26,74,0.10);
  border-radius:99px;
  overflow:hidden;
}
.page-nav__progress-fill{
  height:100%;
  background: linear-gradient(90deg, var(--amg-sky), var(--indigo-7));
  border-radius:99px;
  transition: width 0.5s var(--ease);
}
.page-nav__count{ font-size:11.5px; font-weight:700; color: var(--ink-500); letter-spacing:0.02em; }

/* ============ FOOTER ============ */
.site-footer{
  position: fixed;
  left: var(--rail-width); right:0; bottom:0;
  height: var(--footer-height);
  z-index: 55;
  background: var(--navy);
  display:flex; align-items:center;
  transition: left 0.3s var(--ease);
}
.site-footer__inner{
  display:flex; align-items:center; gap:14px;
  padding: 0 28px;
  width:100%;
}
.site-footer__sap-logo{ height: 22px; width:auto; }
.site-footer__text{
  font-size: 11px;
  color: rgba(255,255,255,0.55);
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ============================================================
   TYPOGRAPHY HELPERS
   ============================================================ */
.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-family: var(--font-body);
  font-size: 12.5px;
  font-weight:700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--indigo-7);
  margin-bottom: 14px;
}
.eyebrow::before{
  content:'';
  width: 18px; height: 2px;
  border-radius: 2px;
  background: var(--grad-accent-line);
}
.section--dark .eyebrow{ color: var(--blue-3); }

.headline{
  font-family: var(--font-display);
  font-weight:700;
  letter-spacing: -0.02em;
  line-height: 1.06;
  color: var(--ink-900);
  font-size: clamp(32px, 4.2vw, 54px);
}
.section--dark .headline{ color:#fff; }
.headline em{
  font-style:normal;
  color: var(--indigo-7);
}
.section--dark .headline em{
  color: #BFD4FF;
}

.subhead{
  font-size: clamp(15px, 1.3vw, 18.5px);
  line-height:1.6;
  color: var(--ink-500);
  font-weight:500;
  max-width: 680px;
  margin-top: 16px;
}
.section--dark .subhead{ color: var(--ink-on-dark-dim); }

.body-text{
  font-size:15px; line-height:1.7; color: var(--ink-700); font-weight:450;
}
.section--dark .body-text{ color: var(--ink-on-dark-dim); }

/* ============================================================
   SECTION HEAD (shared)
   ============================================================ */
.section-head{
  margin-bottom: 40px;
  max-width: 920px;
}
.section-head--center{ margin-left:auto; margin-right:auto; text-align:center; }
.section-head--center .eyebrow::before{ display:none; }
.section-head--center .subhead{ margin-left:auto; margin-right:auto; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; gap:10px;
  font-weight:700; font-size:14.5px;
  padding: 14px 26px;
  border-radius: 999px;
  border:none;
  transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), background 0.25s var(--ease);
  white-space:nowrap;
}
.btn svg{ width:17px; height:17px; }
.btn-primary{
  background: linear-gradient(120deg, var(--indigo-7), var(--indigo-9));
  color:#fff;
  box-shadow: 0 10px 28px rgba(93,54,255,0.32);
}
.btn-primary:hover{ transform: translateY(-3px); box-shadow: 0 16px 36px rgba(93,54,255,0.42); }
.btn-ghost{
  background: rgba(255,255,255,0.08);
  color:#fff;
  border: 1.5px solid rgba(255,255,255,0.35);
  backdrop-filter: blur(8px);
}
.btn-ghost:hover{ background: rgba(255,255,255,0.16); transform: translateY(-3px); }
.btn-light{
  background:#fff;
  color: var(--indigo-9);
  border: 1.5px solid rgba(44,19,173,0.15);
  box-shadow: var(--shadow-card);
}
.btn-light:hover{ transform: translateY(-3px); box-shadow: var(--shadow-float); }

/* ============================================================
   HERO (use-case opener / section dividers)
   ============================================================ */
.hero{
  position:relative;
  border-radius: var(--radius-lg);
  overflow:hidden;
  min-height: 600px;
  background: var(--grad-hero);
  padding: 64px;
  display:flex; flex-direction:column; justify-content:center;
  isolation:isolate;
}
@media (min-height: 760px){
  .hero{ min-height: 78vh; }
}
.hero::before{
  content:'';
  position:absolute; top:0; right:0; bottom:0; left:0; z-index:0;
  background:
    radial-gradient(circle 480px at 85% 20%, rgba(166,224,255,0.28), transparent 70%),
    radial-gradient(circle 600px at 100% 100%, rgba(122,47,214,0.35), transparent 65%);
}
.hero__crystal-deco{
  position:absolute; right: -60px; top:50%; transform: translateY(-50%);
  width: 46vw; max-width: 620px; opacity:0.92;
  z-index:0;
  filter: drop-shadow(0 30px 60px rgba(10,12,40,0.5));
  animation: floatSlow 7s ease-in-out infinite;
}
@keyframes floatSlow{
  0%,100%{ transform: translateY(-50%) rotate(0deg); }
  50%{ transform: translateY(calc(-50% - 14px)) rotate(2deg); }
}
.hero__content{ position:relative; z-index:1; max-width: 640px; }
.hero__eyebrow{
  display:inline-flex; align-items:center; gap:10px;
  font-size:13px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
  color: var(--blue-3);
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.18);
  padding: 8px 16px 8px 12px;
  border-radius:999px;
  margin-bottom:26px;
}
.hero__eyebrow .dot{ width:7px; height:7px; border-radius:50%; background: var(--amg-sky); box-shadow:0 0 0 3px rgba(41,171,226,0.3); }
.hero__title{
  font-family: var(--font-display);
  font-size: clamp(38px, 5vw, 64px);
  font-weight:700;
  color:#fff;
  line-height:1.05;
  letter-spacing:-0.02em;
}
.hero__title em{
  font-style:normal;
  color: #BFE0FF;
}
.hero__sub{
  margin-top:22px;
  font-size: clamp(15px,1.3vw,18px);
  color: var(--ink-on-dark-dim);
  line-height:1.7;
  max-width: 540px;
}
.hero__actions{ display:flex; gap:14px; margin-top:36px; flex-wrap:wrap; }
.hero__tagline{
  margin-top: 40px;
  font-size:13px;
  color: rgba(255,255,255,0.5);
  font-style:italic;
  font-weight:500;
}

/* ============================================================
   OPENER (single-screen storytelling view — usecase section)
   ============================================================ */
.opener{
  position:relative;
  border-radius: var(--radius-lg);
  overflow:hidden;
  background: var(--grad-hero);
  padding: 36px 44px 30px;
  isolation:isolate;
  min-height: 460px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
@media (min-height: 740px){
  .opener{ height: calc(100vh - var(--brandbar-height) - var(--pagenav-height) - var(--footer-height) - 96px); }
}
@media (max-height: 760px){
  .opener{
    padding: 18px 28px 16px;
    justify-content: flex-start;
    gap: 10px;
    max-height: calc(100vh - var(--brandbar-height) - var(--pagenav-height) - var(--footer-height) - 32px);
    overflow:hidden;
  }
  .opener__title{ font-size: clamp(18px, 1.9vw, 24px) !important; }
  .opener__sub{ font-size: 12.5px !important; line-height:1.45 !important; }
  .opener__top{ gap: 18px !important; }
  .opener__mid{ gap: 12px !important; margin: 0 !important; }
  .opener__bottom{ margin-top: 4px !important; }
  .opener__stat{ padding: 10px 12px !important; }
  .opener__stat-num{ font-size: 20px !important; }
  .opener__stat-label{ font-size: 10.5px !important; line-height:1.3 !important; }
  .opener__insight{ padding: 10px 14px !important; }
  .opener__insight-title{ font-size: 10.5px !important; margin-bottom:4px !important; }
  .opener__insight-text{ font-size: 12px !important; line-height:1.4 !important; }
  .opener__flow{ gap: 10px !important; }
  .opener__flow-step strong{ font-size: 12.5px !important; }
  .opener__flow-step span{ font-size: 11px !important; }
  .opener__portfolio{ padding: 10px 14px !important; }
  .opener__portfolio-label{ font-size: 10.5px !important; margin-bottom:8px !important; }
  .opener__portfolio-chips{ gap:6px !important; }
  .opener__portfolio-chips .chip{ font-size: 10.5px !important; padding: 4px 9px !important; }
  .opener__cta{ padding: 10px 20px !important; font-size:13.5px !important; }
}
.opener::before{
  content:'';
  position:absolute; top:0; right:0; bottom:0; left:0; z-index:0;
  background:
    radial-gradient(circle 480px at 88% 12%, rgba(166,224,255,0.22), transparent 70%),
    radial-gradient(circle 600px at 100% 100%, rgba(122,47,214,0.30), transparent 65%);
}
.opener__crystal{
  position:absolute; right: -40px; top: -30px;
  width: 220px; opacity:0.5;
  z-index:0;
  filter: drop-shadow(0 20px 40px rgba(10,12,40,0.5));
}
.opener__top, .opener__mid, .opener__bottom{ position:relative; z-index:1; }

.opener__top{
  display:flex;
  gap:32px;
  align-items:flex-start;
}
.opener__intro{ flex: 1 1 56%; min-width:0; }
.opener__eyebrow{
  display:inline-flex; align-items:center; gap:10px;
  font-size:12px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase;
  color: var(--blue-3);
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.18);
  padding: 6px 14px 6px 10px;
  border-radius:999px;
  margin-bottom:14px;
}
.opener__eyebrow .dot{ width:6px; height:6px; border-radius:50%; background: var(--amg-sky); box-shadow:0 0 0 3px rgba(41,171,226,0.3); }
.opener__title{
  font-family: var(--font-display);
  font-size: clamp(24px, 2.5vw, 34px);
  font-weight:700;
  color:#fff;
  line-height:1.12;
  letter-spacing:-0.01em;
}
.opener__title em{ font-style:normal; color:#BFE0FF; }
.opener__sub{
  margin-top:12px;
  font-size: 13.5px;
  color: var(--ink-on-dark-dim);
  line-height:1.55;
  max-width: 560px;
}
.opener__portfolio{
  flex: 1 1 40%;
  min-width:0;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: var(--radius-md);
  padding: 16px 18px;
}
.opener__portfolio-label{
  font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
  color: rgba(255,255,255,0.55);
  margin-bottom:10px;
}
.opener__portfolio-chips{ display:flex; flex-wrap:wrap; }
.opener__portfolio-chips .chip{
  display:inline-block;
  font-size:11.5px; font-weight:600;
  color:#fff;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.16);
  border-radius:999px;
  padding: 5px 11px;
  margin: 0 6px 6px 0;
}
.opener__portfolio-chips .chip i{ font-style:normal; color: rgba(255,255,255,0.55); }

.opener__mid{
  display:flex;
  gap:24px;
  align-items:stretch;
  margin: 18px 0;
}
.opener__stats{
  flex: 1 1 56%;
  display:flex;
  gap:12px;
}
.opener__stat{
  flex:1 1 0;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 12px 12px;
  min-width:0;
}
.opener__stat-num{
  font-family: var(--font-display);
  font-weight:700;
  font-size: 24px;
  color:#fff;
  line-height:1;
}
.opener__stat-label{
  margin-top:6px;
  font-size:11px;
  line-height:1.4;
  color: rgba(255,255,255,0.6);
}
.opener__insight{
  flex: 1 1 40%;
  min-width:0;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: var(--radius-md);
  padding: 14px 16px;
}
.opener__insight-title{
  font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
  color: var(--blue-3);
  margin-bottom:6px;
}
.opener__insight-text{
  font-size:12.5px;
  line-height:1.5;
  color: rgba(255,255,255,0.78);
}
.opener__insight-text em{ font-style:normal; color:#fff; font-weight:600; }

.opener__bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  flex-wrap:wrap;
  padding-top:16px;
  border-top: 1px solid rgba(255,255,255,0.12);
}
.opener__flow{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  flex: 1 1 auto;
}
.opener__flow-step{
  display:flex; align-items:center; gap:10px;
}
.opener__flow-step div{ display:flex; flex-direction:column; }
.opener__flow-step strong{ font-size:12.5px; color:#fff; font-weight:700; }
.opener__flow-step span{ font-size:11px; color: rgba(255,255,255,0.55); margin-top:1px; max-width:220px; }
.opener__flow-num{
  flex-shrink:0;
  width:24px; height:24px;
  border-radius:50%;
  background: linear-gradient(135deg, var(--indigo-7), var(--amg-sky));
  color:#fff;
  font-size:12px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.opener__flow-arrow{ width:16px; height:16px; color: rgba(255,255,255,0.35); flex-shrink:0; }
.opener__cta{ flex-shrink:0; }

@media (max-width: 980px){
  .opener{ height:auto; padding: 28px 24px 24px; }
  .opener__top, .opener__mid{ flex-direction:column; }
  .opener__stats{ flex-wrap:wrap; }
  .opener__stat{ flex:1 1 calc(50% - 6px); }
  .opener__crystal{ display:none; }
}

/* ============================================================
   CARDS / GRID
   ============================================================ */
.card{
  background: var(--surface-card);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  border: 1px solid rgba(15,26,74,0.05);
}
.card-pad{ padding: 28px; }

.grid{ display:flex; flex-wrap:wrap; gap: 22px; }
.grid > *{ flex: 1 1 0; min-width: 220px; }
.grid-2 > *{ flex-basis: calc(50% - 11px); }
.grid-3 > *{ flex-basis: calc(33.333% - 15px); }
.grid-4 > *{ flex-basis: calc(25% - 17px); }
.grid-5 > *{ flex-basis: calc(20% - 18px); }

@media (max-width: 1180px){
  .grid-4 > *, .grid-5 > *, .grid-3 > *{ flex-basis: calc(50% - 11px); }
}
@media (max-width: 720px){
  .grid-2 > *, .grid-3 > *, .grid-4 > *, .grid-5 > *{ flex-basis: 100%; }
}

/* ============================================================
   PILL / TAG / BADGE
   ============================================================ */
.tag{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:700;
  padding:5px 12px;
  border-radius:999px;
  background: var(--surface-tint);
  color: var(--indigo-9);
  letter-spacing:0.02em;
}
.tag--roadmap{ background: #FFF3DD; color:#9A6300; }
.tag--live{ background:#E3F6E9; color:#1A7A3F; }
.tag--bridge{ background: linear-gradient(90deg, rgba(122,182,72,0.15), rgba(245,166,35,0.15), rgba(41,171,226,0.15)); color: var(--amg-navy-text); }

/* ============================================================
   ICON CIRCLE
   ============================================================ */
.icon-circle{
  width:46px; height:46px;
  border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  background: linear-gradient(135deg, var(--indigo-7), var(--indigo-9));
  color:#fff;
  flex-shrink:0;
  box-shadow: 0 8px 18px rgba(93,54,255,0.28);
}
.icon-circle svg{ width:23px; height:23px; }
.icon-circle--soft{
  background: var(--surface-tint);
  color: var(--indigo-7);
  box-shadow:none;
}

/* ============================================================
   VIDEO FRAME (consistent video presentation component)
   ============================================================ */
.video-frame{
  position:relative;
  border-radius: var(--radius-md);
  overflow:hidden;
  background: #0B1130;
  box-shadow: var(--shadow-float);
  height: 0;
  padding-bottom: 56.25%; /* 16:9 fallback for browsers without aspect-ratio support */
}
@supports (aspect-ratio: 16/9){
  .video-frame{ height:auto; padding-bottom:0; aspect-ratio: 16/9; }
}
.video-frame video{
  position:absolute; top:0; right:0; bottom:0; left:0;
  width:100%; height:100%; object-fit:cover; display:block;
  background:#000;
}
.video-frame__play{
  position:absolute; top:0; right:0; bottom:0; left:0;
  display:flex; align-items:center; justify-content:center;
  background: rgba(10,12,40,0.30);
  cursor:pointer;
  transition: background 0.25s var(--ease);
  border:none;
}
.video-frame__play:hover{ background: rgba(10,12,40,0.42); }
.video-frame__play.is-hidden{ display:none; }
.video-frame__play-icon{
  width:74px; height:74px;
  border-radius:50%;
  background: rgba(255,255,255,0.95);
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 12px 32px rgba(0,0,0,0.35);
  transition: transform 0.25s var(--ease);
}
.video-frame__play:hover .video-frame__play-icon{ transform: scale(1.08); }
.video-frame__play-icon svg{ width:26px; height:26px; margin-left:4px; color: var(--indigo-9); }
.video-frame__label{
  position:absolute; left:16px; bottom:16px;
  color:#fff; font-weight:700; font-size:13.5px;
  display:flex; align-items:center; gap:8px;
  background: rgba(10,12,40,0.55);
  padding: 7px 14px;
  border-radius:999px;
  backdrop-filter: blur(6px);
}
.video-frame__label.is-hidden{ display:none; }
.video-frame__label .rec-dot{
  width:7px;height:7px;border-radius:50%; background:#FF5C5C;
}
.video-caption{
  margin-top:14px;
  font-size:13.5px;
  color: var(--ink-500);
  font-weight:500;
  line-height:1.55;
}
.section--dark .video-caption{ color: var(--ink-on-dark-dim); }
.video-frame--pending{
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
  background: linear-gradient(145deg, #161B3D, #0B1130);
  border: 1.5px dashed rgba(255,255,255,0.18);
  text-align:center;
  padding: 24px;
}
.video-frame--pending svg{ width:34px; height:34px; color: rgba(255,255,255,0.45); }
.video-frame--pending__title{ color:#fff; font-weight:700; font-size:14.5px; }
.video-frame--pending__sub{ color: rgba(255,255,255,0.55); font-size:12.5px; max-width:380px; }

/* ============================================================
   DIAGRAM PANEL (for embedded high-fidelity SAP slide images)
   ============================================================ */
.diagram-panel{
  border-radius: var(--radius-lg);
  overflow:hidden;
  background:#fff;
  box-shadow: var(--shadow-float);
  border: 1px solid rgba(15,26,74,0.06);
  display:flex;
  align-items:center;
  justify-content:center;
}
.diagram-panel img{
  width:100%;
  height:auto;
  max-width:100%;
  display:block;
  object-fit:contain;
  margin:0 auto;
}
.diagram-panel__bar{
  display:flex; align-items:center; justify-content:space-between;
  padding: 14px 22px;
  background: var(--surface-tint);
  border-top: 1px solid rgba(15,26,74,0.06);
}
.diagram-panel__bar-label{ font-size:12.5px; font-weight:700; color: var(--indigo-9); }

/* ============================================================
   TABS (domain selector etc.)
   ============================================================ */
.tabs{
  display:flex; gap:8px; flex-wrap:wrap;
  margin-bottom: 28px;
}
.tab-btn{
  display:flex; align-items:center; gap:9px;
  padding: 11px 20px;
  border-radius: 999px;
  border: 1.5px solid rgba(15,26,74,0.10);
  background:#fff;
  color: var(--ink-700);
  font-weight:700; font-size:13.5px;
  transition: all 0.25s var(--ease);
  flex-shrink:0;
}
.tab-btn svg{ width:17px; height:17px; flex-shrink:0; }
.tab-btn:hover{ border-color: var(--indigo-7); color: var(--indigo-7); }
.tab-btn.is-active{
  background: linear-gradient(120deg, var(--indigo-7), var(--indigo-9));
  border-color:transparent;
  color:#fff;
  box-shadow: 0 8px 20px rgba(93,54,255,0.3);
}

/* ============================================================
   JOULE FLOATING WIDGET
   ============================================================ */
.joule-widget{ display:none; position: fixed; right: 28px; bottom: calc(var(--footer-height) + 24px); z-index: 120; }
.joule-fab{
  width:62px; height:62px;
  border-radius:50%;
  border:none;
  background: linear-gradient(135deg, var(--indigo-7), var(--indigo-9));
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 12px 32px rgba(93,54,255,0.45);
  transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
  animation: pulseFab 3s ease-in-out infinite;
}
.joule-fab:hover{ transform: scale(1.08); }
.joule-fab__crystal{ width:30px; height:30px; }
@keyframes pulseFab{
  0%,100%{ box-shadow: 0 12px 32px rgba(93,54,255,0.45); }
  50%{ box-shadow: 0 12px 32px rgba(93,54,255,0.45), 0 0 0 10px rgba(93,54,255,0.08); }
}
.joule-panel{
  position:absolute; right:0; bottom: 78px;
  width: min(380px, 88vw);
  max-height: min(560px, 70vh);
  background:#fff;
  border-radius: 22px;
  box-shadow: 0 24px 64px rgba(10,12,40,0.35);
  display:flex; flex-direction:column;
  overflow:hidden;
  opacity:0; transform: translateY(16px) scale(0.97);
  pointer-events:none;
  transition: opacity 0.28s var(--ease), transform 0.28s var(--ease);
  border: 1px solid rgba(15,26,74,0.06);
}
.joule-panel.is-open{ opacity:1; transform: translateY(0) scale(1); pointer-events:auto; }
.joule-panel__header{
  display:flex; align-items:center; justify-content:space-between;
  padding: 16px 18px;
  background: linear-gradient(120deg, var(--indigo-7), var(--indigo-9));
  color:#fff;
  flex-shrink:0;
}
.joule-panel__title{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:15.5px; }
.joule-panel__icon{ width:24px; height:24px; }
.joule-panel__close{ background:none; border:none; color:#fff; font-size:22px; line-height:1; opacity:0.85; }
.joule-panel__body{
  flex:1; overflow-y:auto;
  padding: 18px;
  display:flex; flex-direction:column; gap:14px;
  background: linear-gradient(180deg, #FBFBFF, #F4F2FF);
}
.joule-msg{ max-width:88%; font-size:13.8px; line-height:1.55; }
.joule-msg--bot{
  background:#fff; padding:13px 16px; border-radius: 4px 16px 16px 16px;
  box-shadow: 0 4px 14px rgba(15,26,74,0.08);
  color: var(--ink-700);
}
.joule-msg--user{
  align-self:flex-end;
  background: linear-gradient(120deg, var(--indigo-7), var(--indigo-9));
  color:#fff;
  padding:13px 16px; border-radius: 16px 4px 16px 16px;
}
.joule-suggestions{ display:flex; flex-direction:column; gap:8px; }
.joule-suggestion-btn{
  text-align:left;
  background:#fff;
  border: 1px solid rgba(93,54,255,0.18);
  color: var(--indigo-7);
  font-weight:600; font-size:13px;
  padding: 11px 14px;
  border-radius: 12px;
  transition: background 0.2s var(--ease), transform 0.2s var(--ease);
}
.joule-suggestion-btn:hover{ background: var(--surface-tint); transform: translateX(2px); }
.joule-panel__input{
  display:flex; align-items:center; gap:10px;
  padding: 14px 16px;
  border-top: 1px solid rgba(15,26,74,0.07);
  background:#fff;
  flex-shrink:0;
}
.joule-panel__input input{
  flex:1; border:none; outline:none;
  font-size:13.8px;
  font-family: inherit;
  color: var(--ink-900);
}
.joule-panel__input input::placeholder{ color: var(--ink-500); }
.joule-panel__input button{
  width:34px; height:34px; border-radius:50%;
  background: linear-gradient(135deg, var(--indigo-7), var(--indigo-9));
  border:none; color:#fff;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.joule-panel__input button svg{ width:15px; height:15px; }

/* ============================================================
   USE-CASE NARRATIVE (storyboard steps)
   ============================================================ */
.story-flow{
  display:flex; flex-direction:column; gap:0;
  margin-top: 8px;
}
.story-step{
  display:grid;
  grid-template-columns: 64px 1fr;
  gap: 24px;
  padding-bottom: 36px;
  position:relative;
}
.story-step:not(:last-child)::before{
  content:'';
  position:absolute;
  left:31px; top:54px; bottom:0;
  width:2px;
  background: linear-gradient(180deg, rgba(93,54,255,0.35), rgba(93,54,255,0.08));
}
.story-step__num{
  width:64px; height:64px;
  border-radius:18px;
  background: linear-gradient(135deg, var(--indigo-7), var(--indigo-9));
  color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-display);
  font-weight:700; font-size:22px;
  box-shadow: 0 10px 24px rgba(93,54,255,0.3);
  flex-shrink:0;
  z-index:1;
}
.story-step__body{ padding-top: 8px; }
.story-step__title{
  font-family: var(--font-display);
  font-weight:700; font-size:21px;
  color: var(--ink-900);
  margin-bottom:8px;
}
.section--dark .story-step__title{ color:#fff; }
.story-step__text{ font-size:14.5px; line-height:1.7; color: var(--ink-700); max-width:680px; }
.section--dark .story-step__text{ color: var(--ink-on-dark-dim); }
.story-step__tag{ margin-top:10px; }

/* ============================================================
   VIDEO MODAL (pop-up player)
   ============================================================ */
.video-modal{
  display:none;
  position: fixed;
  top:0; right:0; bottom:0; left:0;
  z-index: 500;
  align-items:center;
  justify-content:center;
  padding: 32px;
}
.video-modal.is-open{ display:flex; }
.video-modal__backdrop{
  position:absolute;
  top:0; right:0; bottom:0; left:0;
  background: rgba(8,10,32,0.82);
  backdrop-filter: blur(4px);
}
.video-modal__dialog{
  position:relative;
  z-index:1;
  width:100%;
  max-width: 1040px;
  background:#0B1130;
  border-radius: var(--radius-lg);
  box-shadow: 0 40px 100px rgba(0,0,0,0.55);
  padding: 18px 18px 14px;
  animation: videoModalIn 0.25s var(--ease);
}
@keyframes videoModalIn{
  from{ opacity:0; transform: translateY(14px) scale(0.98); }
  to{ opacity:1; transform: translateY(0) scale(1); }
}
.video-modal__frame{
  position:relative;
  width:100%;
  height:0;
  padding-bottom:56.25%;
  border-radius: 12px;
  overflow:hidden;
  background:#000;
}
@supports (aspect-ratio: 16/9){
  .video-modal__frame{ height:auto; padding-bottom:0; aspect-ratio: 16/9; }
}
.video-modal__frame video{
  position:absolute; top:0; right:0; bottom:0; left:0;
  width:100%; height:100%;
  display:block;
  background:#000;
}
.video-modal__close{
  position:absolute;
  top: -16px; right: -16px;
  width:40px; height:40px;
  border-radius:50%;
  border: none;
  background:#fff;
  color: var(--ink-900);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  box-shadow: 0 8px 22px rgba(0,0,0,0.35);
  z-index:2;
  transition: transform 0.15s var(--ease);
}
.video-modal__close:hover{ transform: scale(1.08); }
.video-modal__close svg{ width:18px; height:18px; }
.video-modal__label{
  color:#fff;
  font-size:14px;
  font-weight:600;
  padding: 14px 6px 4px;
  display:flex; align-items:center; gap:8px;
}
@media (max-width: 640px){
  .video-modal{ padding:14px; }
  .video-modal__dialog{ padding:12px 12px 10px; }
  .video-modal__close{ top:-12px; right:-12px; width:34px; height:34px; }
}

/* ============================================================
   PILLAR CARDS (BDC / BAIP / Autonomous overview)
   ============================================================ */
.pillar-card{
  background:#fff;
  border-radius: var(--radius-md);
  padding: 30px 26px;
  box-shadow: var(--shadow-card);
  border: 1px solid rgba(15,26,74,0.05);
  transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
  position:relative;
  overflow:hidden;
}
.pillar-card:hover{ transform: translateY(-6px); box-shadow: var(--shadow-float); }
.pillar-card__icon{ margin-bottom:18px; }
.pillar-card__title{ font-family: var(--font-display); font-weight:700; font-size:18px; margin-bottom:10px; color: var(--ink-900); }
.pillar-card__text{ font-size:13.8px; line-height:1.65; color: var(--ink-500); }

/* ============================================================
   ASSISTANT / AGENT CATALOG GRID
   ============================================================ */
.domain-pill{
  display:flex; align-items:center; gap:10px;
  padding: 14px 18px;
  border-radius: 14px;
  font-weight:700; font-size:13.5px;
}
.assistant-card{
  background:#fff;
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: 0 2px 10px rgba(15,26,74,0.06);

  'intro': ["Tell me more about today's session"],
  'bdc': ["How does Business Data Cloud connect to S/4HANA?", "What does this foundation unlock for AI?"],
  'architecture': ["Explain the three layers in plain terms", "What is the SAP Knowledge Graph?"],
  'joule-beyond-chat': ["What's the difference between a Space and a Conversation?", "Can business users build their own agents?"],
  'autonomous-suite': ["Give me an example of agents acting across functions", "How does this reduce integration costs?"],
  'assistant-overview': ["Which domain has the most agents?", "Show me Finance assistants"],
  'autonomous-finance': ["Walk me through Record to Report", "What's the ROI of Autonomous Finance?"],
  'what-changes': ["How long does a continuous close take?", "What sources back these benchmarks?"],
  'hr-agent': ["How much time does this save managers?", "When is this agent planned to ship?"],
  'joule-for-developers': ["What can Joule generate for our developers?", "Does this work with ABAP?"],
  'joule-for-consultants': ["How does this help our implementation timeline?"],
  'joule-agents': ["How do I join the live workshop?", "What can our IT team build in 10 minutes?"],
  'ai-beyond-joule': ["What languages are supported?", "Can this read scanned PDFs?"],
  'get-started': ["How do we activate Joule Base?", "Where do I find the learning course?"],
};

</script>
<script>
/* ============================================================
   APP.JS — Interactive engine
   Handles: section rendering & navigation, journey rail / mobile
   drawer sync, strict video lifecycle (stop-on-leave), domain
   tab switching, and the Joule assistant widget.
   ============================================================ */
(function(){
  'use strict';

  /* Safety polyfill: NodeList.forEach (standard since 2016, but
     guards against unusual embedded WebViews in corporate kiosks) */
  if (window.NodeList && !NodeList.prototype.forEach){
    NodeList.prototype.forEach = Array.prototype.forEach;
  }

  let currentIndex = 0;
  const stage = document.getElementById('stage');
  const journeyList = document.getElementById('journeyList');
  const navDrawerList = document.getElementById('navDrawerList');
  const ambientBg = document.getElementById('ambientBg');
  const brandBar = document.getElementById('brandBar');

  /* ---------- Build section DOM nodes once ---------- */
  function buildSections(){
    JOURNEY_SECTIONS.forEach((sec, i) => {
      const el = document.createElement('section');
      el.className = 'section' + (sec.kind === 'dark' ? ' section--dark' : '');
      el.id = 'sec-' + sec.id;
      el.dataset.index = i;
      el.innerHTML = sec.html;
      stage.appendChild(el);
    });
  }

  /* ---------- Build rail + drawer nav items ---------- */
  function buildNav(){
    JOURNEY_SECTIONS.forEach((sec, i) => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'rail-item';
      btn.dataset.index = i;
      btn.innerHTML = `<span class="rail-item__dot"></span><span class="rail-item__label">${sec.navLabel}</span>`;
      btn.addEventListener('click', () => goTo(i));
      li.appendChild(btn);
      journeyList.appendChild(li);

      const dItem = document.createElement('li');
      const dBtn = document.createElement('button');
      dBtn.className = 'nav-drawer__item';
      dBtn.dataset.index = i;
      dBtn.innerHTML = `<span class="rail-item__dot"></span><span>${sec.navLabel}</span>`;
      dBtn.addEventListener('click', () => { goTo(i); closeDrawer(); });
      dItem.appendChild(dBtn);
      navDrawerList.appendChild(dItem);
    });
  }

  /* ---------- Stop ALL playing videos (lifecycle requirement) ---------- */
  function stopAllVideos(exceptEl){
    const videos = document.querySelectorAll('video');
    for (let i = 0; i < videos.length; i++){
      const v = videos[i];
      if (v === exceptEl) continue;
      if (!v.paused) v.pause();
      try { v.currentTime = 0; } catch(e){ /* not yet seekable, safe to ignore */ }

      // Reset frame UI back to "play" state
      const frame = v.closest('.video-frame');
      if (frame){
        const playBtn = frame.querySelector('.video-frame__play');
        const label = frame.querySelector('.video-frame__label');
        if (playBtn) playBtn.classList.remove('is-hidden');
        if (label) label.classList.remove('is-hidden');
      }

      // Release loaded source so large files aren't held in memory off-screen.
      // Only do this for videos the user actually started loading/playing
      // (tracked via data-loaded) — videos still showing their original,
      // never-played default src should be left alone, or every video would
      // lose its src the instant the page loads (during the initial goTo).
      if (v.dataset.loaded === 'true'){
        v.removeAttribute('src');
        v.load();
        v.dataset.loaded = 'false';
      }
    }
  }

  /* ---------- Navigate to a section index ---------- */
  function goTo(index){
    if (index < 0 || index >= JOURNEY_SECTIONS.length) return;
    stopAllVideos(null);
    closeVideoModal();

    document.querySelectorAll('.section').forEach(s => s.classList.remove('is-active'));
    const target = document.getElementById('sec-' + JOURNEY_SECTIONS[index].id);
    target.classList.add('is-active');
    target.scrollTop = 0;
    stage.scrollTop = 0;
    window.scrollTo(0,0);

    currentIndex = index;
    updateChrome();

    // Lazy-init domain tabs the first time we land on that section
    if (JOURNEY_SECTIONS[index].id === 'assistant-overview' && !window.__domainTabsInit){
      initDomainTabs();
      window.__domainTabsInit = true;
    }

    // Refresh Joule suggestions contextually
    refreshJouleSuggestions();
  }

  /* ---------- Update rail / drawer / progress / dark mode chrome ---------- */
  function updateChrome(){
    const sec = JOURNEY_SECTIONS[currentIndex];

    document.querySelectorAll('.rail-item').forEach(b => {
      const i = parseInt(b.dataset.index,10);
      b.classList.toggle('is-active', i === currentIndex);
      b.classList.toggle('is-done', i < currentIndex);
    });
    document.querySelectorAll('.nav-drawer__item').forEach(b => {
      const i = parseInt(b.dataset.index,10);
      b.classList.toggle('is-active', i === currentIndex);
    });

    // Scroll active rail item into view
    const activeRail = document.querySelector('.rail-item.is-active');
    if (activeRail) activeRail.scrollIntoView({ block:'nearest', behavior:'smooth' });

    // Dark hero chrome toggle
    const isDark = sec.kind === 'dark';
    ambientBg.classList.toggle('is-dark', isDark);
    brandBar.classList.toggle('is-dark', isDark);

    // Prev/Next buttons
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === JOURNEY_SECTIONS.length - 1;
    document.getElementById('prevLabel').textContent = currentIndex === 0 ? 'Start' : JOURNEY_SECTIONS[currentIndex-1].navLabel;
    document.getElementById('nextLabel').textContent = currentIndex === JOURNEY_SECTIONS.length - 1 ? 'End' : JOURNEY_SECTIONS[currentIndex+1].navLabel;

    // Progress bar
    const pct = (currentIndex / (JOURNEY_SECTIONS.length - 1)) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('currentIdx').textContent = currentIndex + 1;
    document.getElementById('totalIdx').textContent = JOURNEY_SECTIONS.length;
  }

  /* ---------- Mobile drawer ---------- */
  function openDrawer(){
    document.getElementById('navDrawer').classList.add('is-open');
    document.getElementById('navToggle').setAttribute('aria-expanded','true');
  }
  function closeDrawer(){
    document.getElementById('navDrawer').classList.remove('is-open');
    document.getElementById('navToggle').setAttribute('aria-expanded','false');
  }

  /* ---------- Video frame play/pause wiring (event delegation) ---------- */
  function wireVideoFrames(){
    stage.addEventListener('click', (e) => {
      const playBtn = e.target.closest('.video-frame__play');
      if (!playBtn) return;
      const frame = playBtn.closest('.video-frame');
      const video = frame.querySelector('video');

      // Videos marked data-modal="true" open in the centered pop-up player
      // instead of playing inline (used for the "What Changes" demo reel).
      if (frame.dataset.modal === 'true'){
        openVideoModal(video, frame);
        return;
      }

      // Stop any other playing video first (only one plays at a time)
      stopAllVideos(video);

      if (video.dataset.loaded !== 'true'){
        video.src = video.dataset.src;
        video.dataset.loaded = 'true';
        video.load();
      }
      video.controls = true;
      try {
        const playPromise = video.play();
        if (playPromise && typeof playPromise.catch === 'function'){
          playPromise.catch(()=>{ /* autoplay/sound restrictions — user can use native controls */ });
        }
      } catch (err){
        /* Some browsers throw synchronously rather than rejecting a promise —
           the user can still use native video controls to start playback. */
      }
      playBtn.classList.add('is-hidden');
      const label = frame.querySelector('.video-frame__label');
      if (label) label.classList.add('is-hidden');
    });

    // When a video ends, restore the play overlay
    stage.addEventListener('ended', (e) => {
      if (e.target.tagName !== 'VIDEO') return;
      const frame = e.target.closest('.video-frame');
      if (!frame) return;
      const playBtn = frame.querySelector('.video-frame__play');
      if (playBtn) playBtn.classList.remove('is-hidden');
      const label = frame.querySelector('.video-frame__label');
      if (label) label.classList.remove('is-hidden');
    }, true);
  }

  /* ---------- Video modal (centered pop-up player) ---------- */
  function openVideoModal(sourceVideo, frame){
    const modal = document.getElementById('videoModal');
    const player = document.getElementById('videoModalPlayer');
    const labelEl = document.getElementById('videoModalLabel');
    if (!modal || !player) return;

    // Stop any inline videos playing elsewhere first
    stopAllVideos(null);

    const src = sourceVideo.dataset.src || sourceVideo.getAttribute('src');
    player.src = src;
    player.load();

    const sourceLabel = frame.querySelector('.video-frame__label');
    labelEl.textContent = sourceLabel ? sourceLabel.textContent.trim() : '';

    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';

    try {
      const playPromise = player.play();
      if (playPromise && typeof playPromise.catch === 'function'){
        playPromise.catch(()=>{ /* autoplay/sound restrictions — native controls remain available */ });
      }
    } catch (err){ /* see note above */ }
  }

  function closeVideoModal(){
    const modal = document.getElementById('videoModal');
    const player = document.getElementById('videoModalPlayer');
    if (!modal || !player) return;
    if (!player.paused) player.pause();
    player.removeAttribute('src');
    player.load();
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  function initVideoModal(){
    const modal = document.getElementById('videoModal');
    const backdrop = document.getElementById('videoModalBackdrop');
    const closeBtn = document.getElementById('videoModalClose');
    if (!modal) return;
    if (closeBtn) closeBtn.addEventListener('click', closeVideoModal);
    if (backdrop) backdrop.addEventListener('click', closeVideoModal);
    document.addEventListener('keydown', (e) => {
      const isEscape = e.key === 'Escape' || e.key === 'Esc' || e.keyCode === 27;
      if (isEscape && modal.classList.contains('is-open')) closeVideoModal();
    });
  }

  /* ---------- Domain tabs (Assistant Overview interactive catalog) ---------- */
  function initDomainTabs(){
    const tabsEl = document.getElementById('domainTabs');
    const panelEl = document.getElementById('domainPanel');
    if (!tabsEl || !panelEl) return;

    ASSISTANT_DOMAINS.forEach((d, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (i === 0 ? ' is-active' : '');
      btn.dataset.key = d.key;
      btn.innerHTML = `${d.icon}<span>${d.label}</span>`;
      btn.addEventListener('click', () => {
        tabsEl.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        renderDomainPanel(d);
      });
      tabsEl.appendChild(btn);
    });
    renderDomainPanel(ASSISTANT_DOMAINS[0]);

    function renderDomainPanel(domain){
      panelEl.innerHTML = `
        <div class="grid grid-4" style="gap:14px;">
          ${domain.assistants.map(([name,count]) => `
            <div class="assistant-card">
              <div class="assistant-card__name">${name}</div>
              <div class="assistant-card__count">${count}</div>
            </div>
          `).join('')}
        </div>
      `;
    }
  }

  /* ---------- Joule floating widget ---------- */
  function initJouleWidget(){
    const fab = document.getElementById('jouleFab');
    const panel = document.getElementById('joulePanel');
    const closeBtn = document.getElementById('jouleClose');
    const input = document.getElementById('jouleInput');
    const sendBtn = document.getElementById('jouleSend');
    const body = document.getElementById('jouleBody');

    fab.addEventListener('click', () => {
      panel.classList.toggle('is-open');
      if (panel.classList.contains('is-open')) input.focus();
    });
    closeBtn.addEventListener('click', () => panel.classList.remove('is-open'));

    function send(){
      const val = input.value.trim();
      if (!val) return;
      const userMsg = document.createElement('div');
      userMsg.className = 'joule-msg joule-msg--user';
      userMsg.innerHTML = `<p>${escapeHtml(val)}</p>`;
      body.appendChild(userMsg);
      input.value = '';
      body.scrollTop = body.scrollHeight;

      setTimeout(() => {
        const botMsg = document.createElement('div');
        botMsg.className = 'joule-msg joule-msg--bot';
        botMsg.innerHTML = `<p>Great question — in the live SAP environment, I'd pull that directly from Al Muhaidib's connected systems. For today's walkthrough, your SAP team can take this one live.</p>`;
        body.appendChild(botMsg);
        body.scrollTop = body.scrollHeight;
      }, 550);
    }
    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  }

  function refreshJouleSuggestions(){
    const sec = JOURNEY_SECTIONS[currentIndex];
    const wrap = document.getElementById('jouleSuggestions');
    if (!wrap) return;
    const suggestions = (typeof JOULE_SUGGESTIONS !== 'undefined' && JOULE_SUGGESTIONS[sec.id]) || [];
    wrap.innerHTML = suggestions.map(s => `<button class="joule-suggestion-btn">${escapeHtml(s)}</button>`).join('');
    wrap.querySelectorAll('.joule-suggestion-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('jouleInput').value = btn.textContent;
        document.getElementById('jouleSend').click();
      });
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  /* ---------- Wire bottom nav + hero CTA + keyboard ---------- */
  function wireNav(){
    document.getElementById('prevBtn').addEventListener('click', () => goTo(currentIndex - 1));
    document.getElementById('nextBtn').addEventListener('click', () => goTo(currentIndex + 1));
    document.getElementById('navToggle').addEventListener('click', openDrawer);
    document.getElementById('navDrawerClose').addEventListener('click', closeDrawer);
    document.getElementById('navDrawer').addEventListener('click', (e) => {
      if (e.target.id === 'navDrawer') closeDrawer();
    });

    stage.addEventListener('click', (e) => {
      const navBtn = e.target.closest('[data-nav]');
      if (!navBtn) return;
      const action = navBtn.dataset.nav;
      if (action === 'next') goTo(currentIndex + 1);
      if (action === 'prev') goTo(currentIndex - 1);
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') goTo(currentIndex + 1);
      if (e.key === 'ArrowLeft') goTo(currentIndex - 1);
      if (e.key === 'Escape' || e.keyCode === 27) closeDrawer();
    });
  }

  /* ---------- Stop video also when tab loses visibility (battery/courtesy) ---------- */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden){
      stopAllVideos(null);
      closeVideoModal();
    }
  });

  /* ---------- Init ---------- */
  function init(){
    buildSections();
    buildNav();
    wireNav();
    wireVideoFrames();
    initVideoModal();
    initJouleWidget();

    // Optional deep-link: #section=<id> or #idx=<n> (also used for QA)
    let startIndex = 0;
    const hash = window.location.hash.replace('#','');
    if (hash){
      const byId = JOURNEY_SECTIONS.findIndex(s => s.id === hash.replace('section=',''));
      const byIdxMatch = hash.match(/idx=(\d+)/);
      if (hash.startsWith('section=') && byId >= 0) startIndex = byId;
      else if (byIdxMatch) startIndex = Math.min(parseInt(byIdxMatch[1],10), JOURNEY_SECTIONS.length-1);
    }
    goTo(startIndex);
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
